name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(\d+\.\d+\.\d+)') { $v = $Matches[1] } else { $v = "0.0.0-dev" }
          Write-Host "Build version: $v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish (self-contained single file)
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o dist

      - name: Fetch scrcpy
        shell: pwsh
        run: |
          $ver = "3.3.4"
          $url = "https://github.com/Genymobile/scrcpy/releases/download/v$ver/scrcpy-win64-v$ver.zip"
          Invoke-WebRequest -Uri $url -OutFile scrcpy.zip
          Expand-Archive scrcpy.zip -DestinationPath scrcpy_tmp -Force
          $inner = Get-ChildItem scrcpy_tmp -Directory | Select-Object -First 1
          Copy-Item $inner.FullName "dist/scrcpy" -Recurse -Force

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\*" -DestinationPath "MoyuCast-win64.zip" -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoyuCast-win64
          path: MoyuCast-win64.zip

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $all = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^##\s*\[?" + [regex]::Escape($tag) + "\]?.*?(?=^##\s|\z)"
          $m = [regex]::Match($all, $pattern)
          $body = if ($m.Success) { $m.Value.Trim() } else { $all }
          $body | Set-Content release-body.md -Encoding UTF8
          Write-Host $body

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: MoyuCast-win64.zip
